group 'com.winkk.flutter_native_mutex'
version '0.1.0'

buildscript {
    ext.kotlin_version = '2.4.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

configurations {
    mockitoAgent
}
android {
    namespace = 'com.winkk.flutter_native_mutex'

    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk 24
    }

    dependencies {
        testImplementation 'org.jetbrains.kotlin:kotlin-test-junit'
        testImplementation 'org.mockito:mockito-core:5.23.0'
        mockitoAgent('org.mockito:mockito-core:5.23.0') { transitive = false }
    }

    testOptions {
        unitTests.all {
            jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(provider {
            org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(android.compileOptions.targetCompatibility.toString())
        })
    }
}
