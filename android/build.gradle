group 'com.winkk.flutter_native_mutex'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.7.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
// AGP 9 defaults to built-in Kotlin, but hosts may explicitly retain KGP.
def builtInKotlin = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger() >= 9 &&
        providers.gradleProperty('android.builtInKotlin').getOrElse('true').toBoolean()
if (!builtInKotlin) {
    apply plugin: 'kotlin-android'
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.winkk.flutter_native_mutex'
    }

    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdk 19
    }

    dependencies {
        testImplementation 'org.jetbrains.kotlin:kotlin-test-junit'
        testImplementation 'org.mockito:mockito-core:5.0.0'
    }

    testOptions {
        unitTests.all {
            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

// Read the final Java target when tasks run: hosts may override compileOptions.
// Keep the legacy task API for consumers whose KGP predates compilerOptions.
tasks.configureEach { task ->
    if (task.name.startsWith('compile') && task.name.endsWith('Kotlin')) {
        if (task.hasProperty('compilerOptions')) {
            def jvmTargetType = task.class.classLoader.loadClass('org.jetbrains.kotlin.gradle.dsl.JvmTarget')
            task.compilerOptions.jvmTarget.set(provider {
                jvmTargetType.fromTarget(android.compileOptions.targetCompatibility.toString())
            })
        } else if (task.hasProperty('kotlinOptions')) {
            task.kotlinOptions.jvmTarget = android.compileOptions.targetCompatibility.toString()
        }
    }
}
